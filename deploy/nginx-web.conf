# kamihub 前端静态资源 + API 反向代理
#
# 由 docker-compose 的 web 服务加载。
# 前端用相对路径调用 /api 与 /d，所以这里必须把这两条转发到后端容器，
# 否则前端能打开但所有请求都会 404。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 中文标题/文案必须显式声明 charset，否则 nginx 默认只发 text/html，
    # 浏览器只能靠 <meta charset> 兜底，容易出现乱码。
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后端容器地址（compose 内部服务名）
    #
    # 注意：proxy_pass 里一旦使用变量，nginx 就不再在启动时静态解析域名，
    # 而是每次请求都走 resolver 动态解析。若不声明 resolver，会直接返回
    # 502 并报 "no resolver defined to resolve backend"。
    # 127.0.0.11 是 Docker 内嵌 DNS，valid=10s 让后端容器重建换 IP 后能自动跟上。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:8080";

    # ---------- 带 hash 的静态资源长期缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass         $backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # 手工下单可能包含等待发货的轮询，超时要给够
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering       off;
    }

    # ---------- 提货页（买家访问，必须能直连） ----------
    location /d/ {
        proxy_pass         $backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_buffering       off;
    }

    # ---------- 健康检查 ----------
    location = /health {
        proxy_pass $backend/health;
        access_log off;
    }

    # ---------- 上传的商品图片 ----------
    # 由后端托管（文件落在 backend 容器的 data volume 里）。
    # 不加这条会落到下面的 SPA 兜底，返回 index.html，
    # 图片位置拿到的是一段 HTML —— 表现为「图片全是破图」。
    location /uploads/ {
        proxy_pass         $backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;

        # 文件名是 UUID，内容永不变化，可以放心长缓存
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- robots.txt ----------
    # 由后端输出 "Disallow: /d/"，防止提货页被搜索引擎收录。
    # 必须显式反代：否则会落到下面的 SPA 兜底返回后台的 index.html，
    # 爬虫拿到的是一段 HTML，Disallow 规则等于失效。
    location = /robots.txt {
        proxy_pass $backend/robots.txt;
        access_log off;
    }

    # ---------- 入口 HTML 不缓存 ----------
    # 带内容哈希的 /assets/ 可以缓存一年（上面那条），但入口 HTML 不行：
    # 它决定浏览器去加载哪个 hash 文件。一旦 index.html 被缓存，
    # 发版后浏览器还在加载旧的 JS —— 表现为「功能明明上线了，页面上看不到」，
    # 而且因为 filenames 带 immutable，连刷新都不回源。
    # no-cache 不是不缓存，而是每次回源校验（配合 ETag 命中 304，成本极低）。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # ---------- SPA 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
